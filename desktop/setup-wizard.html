<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAAX ERP - First-Run Setup Wizard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #09090b;
            color: #ffffff;
            height: 100vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #27272a; }
        .logo { width: 40px; height: 40px; background: #ff5e00; border-radius: 8px; font-weight: 900; color: #000; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        h1 { font-size: 20px; font-weight: 700; }
        .card { background: #121215; border: 1px solid #27272a; border-radius: 8px; padding: 20px; margin-bottom: 20px; flex: 1; overflow-y: auto; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #a1a1aa; margin-bottom: 6px; letter-spacing: 0.05em; }
        input, select { width: 100%; background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: 8px 12px; color: #fff; outline: none; font-size: 13px; }
        input:focus, select:focus { border-color: #ff5e00; }
        .btn { background: #ff5e00; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #e05300; }
        .footer { display: flex; justify-content: flex-end; }
        .terminal { background: #000; border: 1px solid #27272a; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; color: #a1a1aa; height: 120px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">R</div>
        <div>
            <h1>RAAX ERP First-Run Desktop Setup</h1>
            <div style="font-size: 12px; color: #71717a;">Auto-Configuring System Environment & Database</div>
        </div>
    </div>

    <div class="card">
        <div class="form-group">
            <label>Database Engine Selection</label>
            <select id="dbEngine" onchange="toggleDbOptions(this.value)">
                <option value="sqlite">SQLite (Local Embedded - Zero Setup)</option>
                <option value="pgsql">PostgreSQL (Enterprise Server - Row-Level Security)</option>
            </select>
        </div>

        <div id="pgOptions" style="display: none;">
            <div class="form-group">
                <label>PostgreSQL Host</label>
                <input type="text" id="pgHost" value="127.0.0.1">
            </div>
            <div class="form-group">
                <label>PostgreSQL Port</label>
                <input type="text" id="pgPort" value="5432">
            </div>
            <div class="form-group">
                <label>Database Name</label>
                <input type="text" id="pgDatabase" value="raax_erp">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="pgUser" value="postgres">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="pgPass" value="">
            </div>
        </div>

        <div class="form-group">
            <label>Initial Setup Mode</label>
            <select id="setupMode">
                <option value="fresh">Fresh Migration & Seed Demo Data</option>
                <option value="migrate">Run Migrations Only (Clean Database)</option>
            </select>
        </div>

        <div class="terminal" id="setupLog">Ready to configure RAAX ERP Environment...</div>
    </div>

    <div class="footer">
        <button class="btn" onclick="startSetup()">Initialize RAAX ERP</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function toggleDbOptions(val) {
            document.getElementById('pgOptions').style.display = val === 'pgsql' ? 'block' : 'none';
        }

        async function startSetup() {
            const log = document.getElementById('setupLog');
            log.innerText = 'Initializing backend database & configuration...';

            const config = {
                db_connection: document.getElementById('dbEngine').value,
                setup_mode: document.getElementById('setupMode').value,
                pg_host: document.getElementById('pgHost').value,
                pg_port: document.getElementById('pgPort').value,
                pg_database: document.getElementById('pgDatabase').value,
                pg_user: document.getElementById('pgUser').value,
                pg_pass: document.getElementById('pgPass').value
            };

            try {
                const res = await ipcRenderer.invoke('run-database-setup', config);
                log.innerText += '\n[SUCCESS] Setup completed cleanly!';
                setTimeout(() => {
                    ipcRenderer.send('setup-complete');
                }, 1000);
            } catch (err) {
                log.innerText += '\n[ERROR] ' + err.message;
            }
        }
    </script>
</body>
</html>
