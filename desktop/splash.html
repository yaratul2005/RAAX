<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAAX ERP Starting...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body {
            background-color: #09090b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #27272a;
            border-radius: 8px;
        }
        .logo-box {
            width: 64px;
            height: 64px;
            background: #ff5e00;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255, 94, 0, 0.3);
        }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
        .title span { color: #ff5e00; }
        .subtitle { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 30px; }
        .progress-container {
            width: 280px;
            height: 4px;
            background: #18181b;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff5e00;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #ff5e00;
        }
        .status-text { font-size: 12px; color: #a1a1aa; font-family: monospace; }
    </style>
</head>
<body>
    <div class="logo-box">R</div>
    <div class="title">RAAX <span>ERP</span></div>
    <div class="subtitle">Enterprise Resource Planning Platform</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Initializing desktop runtime...</div>

    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('boot-status', (event, { percent, text }) => {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('statusText').innerText = text;
        });
    </script>
</body>
</html>
